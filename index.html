<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hanafi – Football en direct</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F5F1;--surface:#FFFFFF;--ink:#10231B;--muted:#5B6B63;--line:#D5DDD6;
  --accent:#0F6B4A;--accent-ink:#FFFFFF;--live:#D62839;--bar:#C9D6CD;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C1612;--surface:#13221B;--ink:#E8F0EA;--muted:#91A39A;--line:#25382F;
    --accent:#4FD39A;--accent-ink:#0C1612;--live:#FF5A66;--bar:#2A4036;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1612;--surface:#13221B;--ink:#E8F0EA;--muted:#91A39A;--line:#25382F;
  --accent:#4FD39A;--accent-ink:#0C1612;--live:#FF5A66;--bar:#2A4036;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-bottom:14px;border-bottom:3px solid var(--ink)}
h1{margin:0;font-family:'Barlow Condensed',Impact,'Arial Narrow',sans-serif;font-weight:800;font-size:56px;line-height:.9;letter-spacing:-.01em}
.sub{margin:6px 0 0;color:var(--muted);font-size:14px}
.demo{font-size:12px;color:var(--muted);text-align:right;max-width:140px}
nav{display:flex;gap:6px;margin:16px 0}
nav button{flex:1;font:600 15px 'Barlow',sans-serif;padding:10px 8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h2{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px;margin:22px 0 8px}
.match{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.team{font-weight:600}
.team.r{text-align:right}
.score{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:34px;line-height:1;min-width:72px;text-align:center}
.status{margin-top:6px;font-size:13px;color:var(--muted);text-align:center}
.live{color:var(--live);font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--live);margin-right:6px;animation:pulse 1.4s infinite}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
@keyframes pulse{50%{opacity:.25}}
.stats{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.stat{margin-bottom:10px}
.stat .l{display:flex;justify-content:space-between;font-size:14px;font-weight:600}
.stat .l span:nth-child(2){color:var(--muted);font-weight:500}
.bar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--bar);margin-top:4px}
.bar i{display:block;background:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.chips button{font:600 14px 'Barlow',sans-serif;padding:6px 12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-variant-numeric:tabular-nums}
.table th,.table td{padding:10px 8px;text-align:center;font-size:15px}
.table th{font-size:13px;color:var(--muted);font-weight:500;border-bottom:1px solid var(--line)}
.table td:nth-child(2),.table th:nth-child(2){text-align:left;font-weight:600}
.table tr+tr td{border-top:1px solid var(--line)}
.table td:last-child{font-weight:700}
.news{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:8px}
.news b{display:block;font-family:'Barlow Condensed',sans-serif;font-size:21px;line-height:1.15;margin-bottom:4px}
.news span{font-size:13px;color:var(--muted)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Hanafi</h1>
      <p class="sub">Scores, stats et actus du football</p>
    </div>
    <div class="demo">Scores via API-Football</div>
  </header>

  <nav role="tablist" aria-label="Sections">
    <button role="tab" aria-selected="true" data-tab="scores">Matchs</button>
    <button role="tab" aria-selected="false" data-tab="table">Classement</button>
    <button role="tab" aria-selected="false" data-tab="news">Actus</button>
  </nav>

  <section id="scores"></section>
  <section id="table" hidden></section>
  <section id="news" hidden></section>
</div>

<script>
const API = "/.netlify/functions/football";
const COMPS = {"Ligue 1":61, "Premier League":39, "Liga":140};
const SHOWN = [61, 39, 140, 2];
const $ = s => document.querySelector(s);
let matches = [], currentComp = "Ligue 1";
const standings = {};
const openIds = new Set();
const news = [
  ["Exemple d’actualité : le derby du week-end","Actus à brancher"],
  ["Exemple d’actualité : le mercato d’hiver","Actus à brancher"]
];

async function get(params){
  const r = await fetch(API + "?" + new URLSearchParams(params));
  if(!r.ok) throw new Error(r.status);
  return r.json();
}
const LIVE = ["1H","HT","2H","ET","BT","P","LIVE","INT"];
const DONE = ["FT","AET","PEN"];
const SOON = ["NS","TBD"];

function mapFixture(f){
  const s = f.fixture.status.short;
  const state = LIVE.includes(s) ? "live" : DONE.includes(s) ? "done" : SOON.includes(s) ? "soon" : "off";
  return {
    id:f.fixture.id, leagueId:f.league.id, league:f.league.name,
    home:f.teams.home.name, away:f.teams.away.name,
    hs:f.goals.home, as:f.goals.away, state, short:s, min:f.fixture.status.elapsed,
    time:new Date(f.fixture.date).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit",timeZone:"Europe/Paris"}),
    stats:null
  };
}
function statusText(m){
  if(m.state==="live") return `<span class="live"><span class="dot"></span>${m.short==="HT"?"Mi-temps":"En direct · "+m.min+"’"}</span>`;
  if(m.state==="done") return "Terminé";
  if(m.state==="soon") return `Coup d’envoi à ${m.time}`;
  return "Reporté ou annulé";
}
function num(v){ return v==null ? 0 : parseInt(v,10) || 0; }
function statsHtml(m){
  if(!m.stats) return `<div class="status">Chargement des statistiques…</div>`;
  if(!m.stats.length) return `<div class="status">Pas de statistiques pour ce match.</div>`;
  return m.stats.map(([name,a,b,u])=>{
    const t=a+b, pct = t? a/t*100 : 50, s=u||"";
    return `<div class="stat"><div class="l"><span>${a}${s}</span><span>${name}</span><span>${b}${s}</span></div><div class="bar"><i style="width:${pct}%"></i></div></div>`;
  }).join("");
}
function renderMatches(){
  if(!matches.length){ $("#scores").innerHTML = `<h2>Aujourd’hui</h2><div class="news"><b>Aucun match aujourd’hui</b><span>Dans Ligue 1, Premier League, Liga et Ligue des champions.</span></div>`; return; }
  let html="", last="";
  matches.forEach(m=>{
    if(m.league!==last){ html += `<h2>${m.league}</h2>`; last=m.league; }
    const score = (m.state==="soon"||m.state==="off") ? "–" : `${m.hs ?? 0} – ${m.as ?? 0}`;
    const open = openIds.has(m.id);
    html += `<button class="match" data-id="${m.id}" aria-expanded="${open}">
      <div class="row"><div class="team">${m.home}</div><div class="score">${score}</div><div class="team r">${m.away}</div></div>
      <div class="status">${statusText(m)}</div>
      <div class="stats" ${open?"":"hidden"}>${statsHtml(m)}</div></button>`;
  });
  $("#scores").innerHTML = html;
}
async function loadMatches(){
  try{
    const d = await get({type:"fixtures"});
    matches = (d.response||[]).filter(f=>SHOWN.includes(f.league.id)).map(mapFixture)
      .sort((a,b)=>a.league.localeCompare(b.league) || a.time.localeCompare(b.time));
    renderMatches();
  }catch(e){
    $("#scores").innerHTML = `<div class="news"><b>Impossible de charger les matchs</b><span>Vérifie la clé API dans Netlify, puis recharge la page.</span></div>`;
  }
}
async function loadStats(m){
  try{
    const d = await get({type:"stats", fixture:m.id});
    const r = d.response||[];
    if(r.length<2){ m.stats=[]; }
    else{
      const val = (t,k)=>{ const x=t.statistics.find(s=>s.type===k); return x? num(x.value):0; };
      m.stats = [["Possession","Ball Possession","%"],["Tirs","Total Shots"],["Tirs cadrés","Shots on Goal"],["Corners","Corner Kicks"]]
        .map(([n,k,u])=>[n,val(r[0],k),val(r[1],k),u]);
    }
  }catch(e){ m.stats=[]; }
  renderMatches();
}
$("#scores").addEventListener("click", e=>{
  const b=e.target.closest(".match"); if(!b) return;
  const id=Number(b.dataset.id), m=matches.find(x=>x.id===id);
  if(openIds.has(id)){ openIds.delete(id); } else { openIds.add(id); if(!m.stats && m.state!=="soon") loadStats(m); else if(m.state==="soon") m.stats=[]; }
  renderMatches();
});

async function renderTable(){
  const chips = Object.keys(COMPS).map(c=>`<button data-comp="${c}" aria-pressed="${c===currentComp}">${c}</button>`).join("");
  let body = "";
  try{
    if(!standings[currentComp]){
      const d = await get({type:"standings", league:COMPS[currentComp]});
      const rows = d.response && d.response[0] ? d.response[0].league.standings[0] : [];
      standings[currentComp] = rows.map(r=>[r.rank, r.team.name, r.all.played, r.points]);
    }
    body = `<table class="table"><tr><th>#</th><th>Équipe</th><th>J</th><th>Pts</th></tr>${
      standings[currentComp].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join("")}</table>`;
    if(!standings[currentComp].length) body = `<div class="news"><b>Classement indisponible</b><span>Les données de cette saison ne sont pas disponibles.</span></div>`;
  }catch(e){ body = `<div class="news"><b>Impossible de charger le classement</b><span>Réessaie dans un instant.</span></div>`; }
  $("#table").innerHTML = `<div class="chips">${chips}</div><h2>${currentComp}</h2>${body}`;
}
$("#table").addEventListener("click", e=>{
  const b=e.target.closest("button[data-comp]"); if(!b) return;
  currentComp=b.dataset.comp; renderTable();
});

function renderNews(){
  $("#news").innerHTML = `<h2>À la une</h2>` + news.map(n=>`<div class="news"><b>${n[0]}</b><span>${n[1]}</span></div>`).join("");
}
document.querySelector("nav").addEventListener("click", e=>{
  const b=e.target.closest("button"); if(!b) return;
  document.querySelectorAll("nav button").forEach(x=>x.setAttribute("aria-selected", x===b));
  ["scores","table","news"].forEach(id=>$("#"+id).hidden = id!==b.dataset.tab);
  if(b.dataset.tab==="table") renderTable();
});

renderNews(); loadMatches();
setInterval(()=>{ if(!document.hidden) loadMatches(); }, 60000);
</script>
</body>
</html>
